[project]
name = "web-search-mcp"
version = "1.1.0"
description = "MCP server for web search and page fetch with multi-provider fallback"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "lxml>=5.0",
    "ddgs>=9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.scripts]
web-search-mcp = "web_search_mcp.mcp:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_search_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
